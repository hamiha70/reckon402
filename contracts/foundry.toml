[profile.default]
src            = "src"
out            = "out"
libs           = ["lib"]
test           = "test"
script         = "script"
solc           = "0.8.24"
evm_version    = "cancun"
optimizer      = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]
gas_reports    = ["Splitter"]
remappings     = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 256

[profile.ci]
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 50 }

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_PRIMARY}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
