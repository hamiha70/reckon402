<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reckon402 — Live Agent Network</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'JetBrains Mono', 'Fira Mono', 'Courier New', monospace; }
    @keyframes pulse-new {
      0%   { background-color: rgba(34,197,94,0.15); }
      100% { background-color: transparent; }
    }
    .row-new { animation: pulse-new 2s ease-out forwards; }
    .strike  { text-decoration: line-through; opacity: 0.45; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4 md:p-8">

  <!-- Header -->
  <header class="mb-8 border-b border-gray-800 pb-4">
    <h1 class="text-2xl font-bold tracking-tight text-green-400">
      Reckon402 — Live Agent Network
    </h1>
    <p class="text-gray-500 text-sm mt-1">Base Sepolia testnet · auto-refresh every 5s</p>
  </header>

  <!-- Section A: Agent Roster -->
  <section class="mb-10">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-lg font-semibold text-gray-200 tracking-wide uppercase text-xs">
        Agent Roster
      </h2>
      <span id="roster-last-updated" class="text-gray-600 text-xs"></span>
    </div>

    <div class="overflow-x-auto rounded-lg border border-gray-800">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-gray-800 text-gray-500 text-xs uppercase tracking-wider">
            <th class="text-left px-4 py-3">Agent ID</th>
            <th class="text-left px-4 py-3">Wallet</th>
            <th class="text-right px-4 py-3">Rep Count</th>
            <th class="text-center px-4 py-3">Tier</th>
            <th class="text-left px-4 py-3">Escrow</th>
            <th class="text-right px-4 py-3">Last Seen</th>
          </tr>
        </thead>
        <tbody id="agent-roster-body">
          <tr id="roster-empty-row">
            <td colspan="6" class="text-center py-10 text-gray-600 italic">
              No agents registered yet — run the demo script to populate
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- Section B: Live Payment Feed -->
  <section>
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-lg font-semibold text-gray-200 tracking-wide uppercase text-xs">
        Live Payment Feed
      </h2>
      <span id="feed-last-updated" class="text-gray-600 text-xs"></span>
    </div>

    <div class="overflow-x-auto rounded-lg border border-gray-800">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-gray-800 text-gray-500 text-xs uppercase tracking-wider">
            <th class="text-left px-4 py-3">Payment ID</th>
            <th class="text-center px-4 py-3">Status</th>
            <th class="text-right px-4 py-3">Amount</th>
            <th class="text-right px-4 py-3">Time</th>
            <th class="text-center px-4 py-3">Tx</th>
          </tr>
        </thead>
        <tbody id="payment-feed-body">
          <tr id="feed-empty-row">
            <td colspan="5" class="text-center py-10 text-gray-600 italic">
              No payments yet — run the demo script
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <script>
    // ── Config ──────────────────────────────────────────────────────────────
    const FACILITATOR_URL    = 'https://facilitator.reckon402.com'
    const GATEWAY_URL        = 'https://gateway.reckon402.com'
    const POLL_MS            = 5_000

    // Base Sepolia RPC
    const BASE_SEPOLIA_RPC   = 'https://sepolia.base.org'

    // ERC-8004 + L4d contracts on Base Sepolia (canonical, from AGENTS.md)
    const IDENTITY_ADDR      = '0x8004A818BFB912233c491871b3d84c89A494BD9e'
    const REPUTATION_ADDR    = '0x8004B663056A597Dffe9eCcC1965A193B7388713'
    const ESCROW_FACTORY_ADDR= '0xb06998682bd716e0864257b3ac3aa1fc4cc64589'

    // LinearMonotonicTierStrategy v1 thresholds (canonical)
    // Indices 0..7 → T0..T7; releaseBps=[0,500,1500,3000,5000,7000,8500,10000]
    const TIER_THRESHOLDS    = [0, 1, 3, 10, 30, 100, 300, 1000]

    // Known payment IDs seen this session
    const knownPaymentIds = new Set()

    // ── Helpers ─────────────────────────────────────────────────────────────
    function trunc(addr, n = 6) {
      if (!addr || addr.length < 12) return addr ?? '—'
      return addr.slice(0, n + 2) + '…' + addr.slice(-4)
    }

    function fmtUsdc(raw) {
      if (!raw) return '—'
      const n = Number(raw) / 1e6
      return n.toFixed(n < 0.01 ? 6 : 4) + ' USDC'
    }

    function fmtAge(unixSec) {
      if (!unixSec) return '—'
      const diff = Math.floor(Date.now() / 1000) - unixSec
      if (diff < 60)   return diff + 's ago'
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago'
      return Math.floor(diff / 3600) + 'h ago'
    }

    function now() { return new Date().toLocaleTimeString() }

    function statusBadge(state) {
      const map = {
        CONFIRMED:           'bg-green-900 text-green-300',
        RECONCILED:          'bg-teal-900 text-teal-300',
        PENDING_CONFIRMATION:'bg-yellow-900 text-yellow-300',
        SUBMITTED:           'bg-blue-900 text-blue-300',
        FAILED:              'bg-red-900 text-red-400',
      }
      const cls = map[state] ?? 'bg-gray-800 text-gray-400'
      return `<span class="px-2 py-0.5 rounded text-xs font-semibold ${cls}">${state ?? 'UNKNOWN'}</span>`
    }

    // Derive tier label from attestation count using the canonical v1 curve.
    // TIER_THRESHOLDS = [0,1,3,10,30,100,300,1000] → T0..T7
    function tierLabel(repCount) {
      let tier = 0
      for (let i = 0; i < TIER_THRESHOLDS.length; i++) {
        if (repCount >= TIER_THRESHOLDS[i]) tier = i
      }
      const releaseBps = [0, 500, 1500, 3000, 5000, 7000, 8500, 10000]
      const bps = releaseBps[tier]
      const pct = (bps / 100).toFixed(0) + '%'
      const cls = tier === 0 ? 'text-gray-500'
                : tier <= 2  ? 'text-cyan-400'
                : tier <= 4  ? 'text-yellow-400'
                              : 'text-green-400 font-bold'
      return { label: `T${tier} ${pct}`, cls }
    }

    function basescanLink(tx) {
      if (!tx) return '—'
      return `<a href="https://sepolia.basescan.org/tx/${tx}" target="_blank"
               class="text-blue-400 hover:text-blue-300 underline">${trunc(tx, 8)}</a>`
    }

    function basescanAddrLink(addr, label) {
      if (!addr || addr === '0x0000000000000000000000000000000000000000') return label ?? '—'
      const display = label ?? trunc(addr)
      return `<a href="https://sepolia.basescan.org/address/${addr}" target="_blank"
               class="text-blue-400 hover:text-blue-300 underline font-mono text-xs">${display}</a>`
    }

    // ── RPC helpers ─────────────────────────────────────────────────────────
    async function rpcCall(method, params) {
      const res = await fetch(BASE_SEPOLIA_RPC, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }),
      })
      const j = await res.json()
      return j.result
    }

    async function ethCall(to, data) {
      return rpcCall('eth_call', [{ to, data }, 'latest'])
    }

    function encUint256(n) {
      return BigInt(n).toString(16).padStart(64, '0')
    }

    function decUint256(hex, offset = 0) {
      return parseInt(hex.slice(offset * 64 + 2, offset * 64 + 66), 16)
    }

    function decAddress(hex, offset = 0) {
      return '0x' + hex.slice(offset * 64 + 26, offset * 64 + 66)
    }

    // ownerOf(uint256) → address  [selector 0x6352211e]
    async function ownerOf(contract, tokenId) {
      try {
        const data = '0x6352211e' + encUint256(tokenId)
        const result = await ethCall(contract, data)
        if (!result || result === '0x') return null
        return '0x' + result.slice(26)
      } catch { return null }
    }

    // escrowOfAgent(uint256) → address  [selector 0x8775fa4d]
    async function escrowOfAgent(agentId) {
      try {
        const data = '0x8775fa4d' + encUint256(agentId)
        const result = await ethCall(ESCROW_FACTORY_ADDR, data)
        if (!result || result === '0x') return null
        const addr = '0x' + result.slice(26)
        if (addr === '0x0000000000000000000000000000000000000000') return null
        return addr
      } catch { return null }
    }

    // attestationCount() → uint64  [selector 0xa15b9321]
    // Called on the Escrow contract, not the registry.
    async function attestationCountFromEscrow(escrowAddr) {
      try {
        const result = await ethCall(escrowAddr, '0xa15b9321')
        if (!result || result === '0x') return null
        return decUint256(result)
      } catch { return null }
    }

    // ── Section A: Agent Roster ──────────────────────────────────────────
    const rosterBody    = document.getElementById('agent-roster-body')
    const rosterEmpty   = document.getElementById('roster-empty-row')
    const rosterUpdated = document.getElementById('roster-last-updated')

    // In-memory roster state: agentId → { owner, repCount, escrowAddr, lastSeen }
    const rosterState = new Map()

    // Agents onboarded before L4d (no Escrow in EscrowFactory).
    // These had Splitter-only setups; mark their Escrow column as "(legacy)".
    // agentId=1 has a probe Escrow (deployed directly, not via the pre-L4d flow).
    // We detect "(legacy)" dynamically: if escrowOfAgent returns null, it's legacy.

    async function refreshRoster() {
      try {
        // Iterate known agentIds. IdentityRegistry (ERC-8004) does not expose
        // totalSupply; we probe a fixed window instead.
        // seller11 has agentId=5423 — include it explicitly.
        const knownIds = [1, 5423]

        for (const id of knownIds) {
          const owner = await ownerOf(IDENTITY_ADDR, id)
          if (!owner || owner === '0x0000000000000000000000000000000000000000') continue

          const escrowAddr = await escrowOfAgent(id)

          let repCount = null
          if (escrowAddr) {
            repCount = await attestationCountFromEscrow(escrowAddr)
          }

          const prev = rosterState.get(id)
          rosterState.set(id, {
            owner,
            repCount: repCount ?? 0,
            escrowAddr,
            lastSeen: prev?.lastSeen ?? null,
          })
        }

        renderRoster()
        rosterUpdated.textContent = 'updated ' + now()
      } catch (e) {
        rosterUpdated.textContent = 'error: ' + e.message
      }
    }

    function renderRoster() {
      if (!rosterState.size) return
      rosterEmpty.style.display = 'none'

      for (const [id, agent] of rosterState) {
        const rowId = `roster-row-${id}`
        let row = document.getElementById(rowId)
        const isNew = !row
        if (!row) {
          row = document.createElement('tr')
          row.id = rowId
          row.className = 'border-b border-gray-800 hover:bg-gray-900 transition-colors'
          rosterBody.appendChild(row)
        }

        const tier = tierLabel(agent.repCount)

        const escrowCell = agent.escrowAddr
          ? basescanAddrLink(agent.escrowAddr)
          : '<span class="text-gray-600 text-xs">(legacy)</span>'

        row.innerHTML = `
          <td class="px-4 py-3 text-cyan-400 font-bold">#${id}</td>
          <td class="px-4 py-3 text-gray-300 font-mono text-xs">${trunc(agent.owner)}</td>
          <td class="px-4 py-3 text-right tabular-nums">${agent.repCount}</td>
          <td class="px-4 py-3 text-center">
            <span class="${tier.cls} text-xs">${tier.label}</span>
          </td>
          <td class="px-4 py-3">${escrowCell}</td>
          <td class="px-4 py-3 text-right text-gray-500 text-xs">${agent.lastSeen ? fmtAge(agent.lastSeen) : '—'}</td>
        `
        if (isNew) {
          row.classList.add('row-new')
          setTimeout(() => row.classList.remove('row-new'), 2100)
        }
      }
    }

    // ── Section B: Payment Feed ──────────────────────────────────────────
    // The facilitator /admin/receipts endpoint requires Bearer auth and is not
    // callable from a public page. We track payment IDs seen in this session via
    // the agent's response headers and the BroadcastChannel, seeding with a
    // small set of known IDs. Individual receipts are fetched from the public
    // GET /x402/receipt/:paymentId endpoint.
    //
    // Facilitator base URL: https://facilitator.reckon402.com
    const SEED_PAYMENT_IDS = [
      '0x9735e05eca7a3219438f3a4a103ef86e4b9419860f8b7c6ce0274ac2462f5ce3', // L4b1 first attestation
    ]

    const feedBody    = document.getElementById('payment-feed-body')
    const feedEmpty   = document.getElementById('feed-empty-row')
    const feedUpdated = document.getElementById('feed-last-updated')
    const feedState   = new Map() // paymentId → receipt row

    for (const id of SEED_PAYMENT_IDS) knownPaymentIds.add(id)

    async function fetchReceipt(paymentId) {
      try {
        const res = await fetch(`${FACILITATOR_URL}/x402/receipt/${paymentId}`)
        if (!res.ok) return null
        return res.json()
      } catch { return null }
    }

    async function refreshFeed() {
      let updated = false
      for (const id of knownPaymentIds) {
        const data = await fetchReceipt(id)
        if (!data) continue
        const prev = feedState.get(id)
        const isNew = !prev || prev.state !== data.state
        feedState.set(id, { ...data, _isNew: isNew })
        if (isNew) updated = true
      }
      if (updated) renderFeed()
      feedUpdated.textContent = 'updated ' + now()
    }

    function renderFeed() {
      if (!feedState.size) return
      feedEmpty.style.display = 'none'

      const sorted = [...feedState.values()].sort((a, b) => {
        const at = r => r.receipt?.submittedAt ?? 0
        return at(b) - at(a)
      })

      feedBody.innerHTML = ''
      for (const r of sorted) {
        const row = document.createElement('tr')
        row.className = 'border-b border-gray-800 hover:bg-gray-900 transition-colors'
        if (r._isNew) {
          row.classList.add('row-new')
          setTimeout(() => row.classList.remove('row-new'), 2100)
        }
        row.innerHTML = `
          <td class="px-4 py-3 font-mono text-xs text-gray-300">${trunc(r.paymentId, 8)}</td>
          <td class="px-4 py-3 text-center">${statusBadge(r.state)}</td>
          <td class="px-4 py-3 text-right tabular-nums text-gray-200">${fmtUsdc(r.amount)}</td>
          <td class="px-4 py-3 text-right text-gray-500 text-xs">${fmtAge(r.receipt?.submittedAt)}</td>
          <td class="px-4 py-3 text-center">${basescanLink(r.transaction)}</td>
        `
        feedBody.appendChild(row)
      }
    }

    // ── Wire up new paymentIds ───────────────────────────────────────────
    window.addPaymentId = (id) => {
      knownPaymentIds.add(id)
      refreshFeed()
    }

    try {
      const bc = new BroadcastChannel('reckon402-demo')
      bc.onmessage = (e) => {
        if (e.data?.type === 'payment' && e.data.paymentId) {
          window.addPaymentId(e.data.paymentId)
        }
      }
    } catch { /* BroadcastChannel not available */ }

    // ── Boot ─────────────────────────────────────────────────────────────
    refreshRoster()
    refreshFeed()
    setInterval(refreshRoster, POLL_MS)
    setInterval(refreshFeed,   POLL_MS)
  </script>
</body>
</html>
