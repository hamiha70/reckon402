name                = "reckon402-gateway"
main                = "src/index.ts"
compatibility_date  = "2026-04-28"
compatibility_flags = ["nodejs_compat"]

account_id  = "0f38f8667bbcbe4f54eda13c8df009e0"
workers_dev = false

# Top-level bindings are for `wrangler dev` only. Named envs (staging,
# production) do NOT inherit these blocks — duplicate everything
# under each [env.<name>] below (L4a₁ lesson 1).

[[d1_databases]]
binding       = "DB"
database_name = "reckon402-d1-gateway-dev"
database_id   = "926ca731-4952-438e-a70c-f19722dc25b0"

[vars]
RESOLVER_CONTRACT_ADDRESS_SEPOLIA = "0x479660B8760b32045FF4b9A64f9Ba2EeF8521f3a"
ENABLE_ERC8004_READS              = "true"
STEALTH_ENABLED                   = "false"
BASE_MAINNET_RPC                  = ""
CACHE_TTL_REPUTATION_S            = "300"
# L4c: public address of the Reckon402 onboarding EOA. Fill at deploy time
# (the corresponding private key lives in Infisical; the onboard-orchestrator
# worker holds it).
RECKON402_ONBOARDING_EOA          = "0xD53ffac42496d73B3Faf946786688a8454F57b1f"

# secrets bound at deploy time via `wrangler secret put` (from Infisical):
#   RECKON402_RESOLVER_SIGNER_PK   — hot signer key (0x-prefixed 32-byte hex)
#   ETH_SEPOLIA_RPC_PRIMARY        — Ethereum Sepolia RPC URL
#   BASE_SEPOLIA_RPC               — Base Sepolia RPC URL (L4a₂)
#   GATEWAY_CACHE_HOOK_TOKEN       — bearer token for /hooks/cache-invalidate (L4a₂)

[env.production]
[[env.production.d1_databases]]
binding       = "DB"
database_name = "reckon402-d1-gateway-dev"
database_id   = "926ca731-4952-438e-a70c-f19722dc25b0"

[env.production.vars]
RESOLVER_CONTRACT_ADDRESS_SEPOLIA = "0x479660B8760b32045FF4b9A64f9Ba2EeF8521f3a"
ENABLE_ERC8004_READS              = "true"
STEALTH_ENABLED                   = "false"
BASE_MAINNET_RPC                  = ""
CACHE_TTL_REPUTATION_S            = "300"
RECKON402_ONBOARDING_EOA          = "0xD53ffac42496d73B3Faf946786688a8454F57b1f"

[[env.production.routes]]
pattern       = "gateway.reckon402.com"
custom_domain = true

[env.staging]
[[env.staging.d1_databases]]
binding       = "DB"
database_name = "reckon402-d1-gateway-dev"
database_id   = "926ca731-4952-438e-a70c-f19722dc25b0"

[env.staging.vars]
RESOLVER_CONTRACT_ADDRESS_SEPOLIA = "0x479660B8760b32045FF4b9A64f9Ba2EeF8521f3a"
ENABLE_ERC8004_READS              = "true"
STEALTH_ENABLED                   = "false"
BASE_MAINNET_RPC                  = ""
CACHE_TTL_REPUTATION_S            = "300"
RECKON402_ONBOARDING_EOA          = "0xD53ffac42496d73B3Faf946786688a8454F57b1f"

[[env.staging.routes]]
pattern       = "gateway-staging.reckon402.com"
custom_domain = true
